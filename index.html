<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मुंबई लोकल | Mumbai Local Deluxe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Teko:wght@300;400;500&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --burnt-red: #5e2121;
            --mustard: #d4a017;
            --cream: #f5f5dc;
            --charcoal: #0a0a0a;
            --glass: rgba(15, 15, 15, 0.8);
            --border-warm: rgba(212, 160, 23, 0.4);
            --glow: rgba(212, 160, 23, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #000; font-family: 'Poppins', sans-serif; color: var(--cream); 
        }

        /* --- CINEMATIC ANIMATED BACKGROUND --- */
        .train-viewport {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            animation: train-vibration 4s infinite ease-in-out;
        }

        .scene-svg { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7) contrast(1.1); }

        /* Scenery movement outside window */
        .window-scenery {
            animation: scenery-move 20s infinite linear;
        }

        /* Rain Animation */
        .rain-drop {
            fill: rgba(255,255,255,0.4);
            animation: rain-fall 3s infinite linear;
        }

        @keyframes scenery-move {
            from { transform: translateX(0); }
            to { transform: translateX(-1000px); }
        }

        @keyframes train-vibration {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(1px, 1px) rotate(0.05deg); }
            50% { transform: translate(-0.5px, -1px) rotate(-0.05deg); }
            75% { transform: translate(-1px, 0.5px) rotate(0.02deg); }
        }

        @keyframes rain-fall {
            0% { transform: translateY(-20px); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(100px); opacity: 0; }
        }

        /* Cinematic Overlays */
        .vignette { position: fixed; inset: 0; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%); z-index: 2; pointer-events: none; }
        .film-grain { position: fixed; inset: 0; z-index: 3; opacity: 0.05; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }

        /* --- UI ELEMENTS --- */
        .ui-layer { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; }

        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--glass); backdrop-filter: blur(20px); 
            border: 1px solid var(--border-warm); padding: 10px 25px; border-radius: 50px;
            width: fit-content; margin: 0 auto; min-width: 85%;
        }

        .ist-clock { font-family: 'Teko', sans-serif; font-size: 1.6rem; color: var(--mustard); min-width: 100px; }
        .status-pill { font-size: 0.8rem; letter-spacing: 1px; opacity: 0.9; }
        .live-dot { color: #4CAF50; animation: blink 2s infinite; margin-right: 6px; }

        .source-selector { display: flex; gap: 10px; }
        .chip { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-warm);
            padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: var(--cream);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .chip:hover { background: var(--mustard); color: #000; box-shadow: 0 0 15px var(--glow); }
        .chip.active { background: var(--mustard); color: #000; border-color: white; }

        /* Center Title */
        .hero { text-align: center; pointer-events: none; }
        .main-title { 
            font-family: 'Rozha One', serif; font-size: clamp(4rem, 10vw, 8.5rem); 
            line-height: 1; text-shadow: 0 15px 50px rgba(0,0,0,0.9); margin-bottom: 5px;
        }
        .tagline { font-family: 'Teko', sans-serif; font-size: clamp(1.2rem, 2vw, 2.2rem); letter-spacing: 5px; opacity: 0.85; }

        /* --- DUAL PLAYER UI --- */
        .player-anchor { 
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            margin-bottom: 20px;
        }

        /* YouTube Custom Player */
        .yt-player-card {
            background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--border-warm);
            padding: 15px 25px; border-radius: 100px; display: flex; align-items: center;
            gap: 20px; width: 480px; max-width: 95vw; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transition: transform 0.5s ease;
        }

        .album-art { 
            width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--mustard);
            overflow: hidden; flex-shrink: 0; animation: spin 10s linear infinite;
            animation-play-state: paused;
        }
        .album-art.playing { animation-play-state: running; }
        .album-art img { width: 100%; height: 100%; object-fit: cover; }

        .meta { flex-grow: 1; overflow: hidden; }
        .song-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist { font-size: 0.7rem; opacity: 0.6; text-transform: uppercase; }

        .btn-wrap { display: flex; align-items: center; gap: 18px; }
        .control-btn { 
            background: none; border: none; color: var(--cream); cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .control-btn svg { width: 22px; height: 22px; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
        .control-btn:hover { color: var(--mustard); transform: scale(1.2); }
        .play-trigger { 
            background: var(--cream); color: #000; width: 42px; height: 42px; 
            border-radius: 50%; box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* Spotify Mode */
        #spotify-embed-container { display: none; width: 480px; max-width: 95vw; height: 80px; border-radius: 15px; overflow: hidden; border: 1px solid var(--border-warm); }

        /* Progress Bar */
        .progress-bar-container {
            position: absolute; top: -1px; left: 60px; right: 60px; height: 2px;
            background: rgba(255,255,255,0.1);
        }
        .progress-fill { height: 100%; background: var(--mustard); width: 0%; box-shadow: 0 0 8px var(--mustard); }

        /* --- MODAL --- */
        .modal-bg { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 1000; display: none; align-items: center; justify-content: center; 
        }
        .modal { 
            background: #111; border: 1px solid var(--mustard); padding: 40px; border-radius: 25px;
            width: 450px; max-width: 90%; text-align: center;
        }
        .modal h2 { font-family: 'Teko', sans-serif; color: var(--mustard); font-size: 2rem; margin-bottom: 20px; }
        .modal input { 
            width: 100%; padding: 15px 25px; background: #000; border: 1px solid #333; 
            color: white; border-radius: 30px; margin-bottom: 25px; outline: none; font-family: inherit;
        }
        .modal input:focus { border-color: var(--mustard); }
        .modal-btns { display: flex; gap: 15px; justify-content: center; }
        .action-btn { 
            padding: 10px 30px; border-radius: 30px; border: none; font-weight: 600; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .btn-load { background: var(--mustard); color: #000; }
        .btn-cancel { background: #333; color: #fff; }

        /* --- ANIMATIONS --- */
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        #yt-api-node { display: none; }

        @media (max-width: 768px) {
            .top-bar { min-width: 95%; }
            .source-selector { display: none; }
            .yt-player-card, #spotify-embed-container { width: 95vw; }
        }
    </style>
</head>
<body>

    <!-- Animated Train Background -->
    <div class="train-viewport">
        <svg class="scene-svg" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#1a1c2c"/><stop offset="100%" stop-color="#4a192c"/>
                </linearGradient>
                <clipPath id="windowClip">
                    <rect x="150" y="150" width="550" height="450" rx="40"/>
                </clipPath>
            </defs>

            <!-- Sky Background -->
            <rect width="1600" height="900" fill="url(#sky)"/>

            <!-- Moving Scenery (Outside Window) -->
            <g clip-path="url(#windowClip)">
                <g class="window-scenery">
                    <!-- Repeated Landscape Elements -->
                    <rect x="0" y="400" width="5000" height="500" fill="#0d0d0d"/>
                    <circle cx="100" cy="350" r="80" fill="#151515"/>
                    <circle cx="500" cy="380" r="100" fill="#151515"/>
                    <circle cx="900" cy="340" r="70" fill="#151515"/>
                    <rect x="200" y="200" width="10" height="300" fill="#222"/> <!-- Electric Pole -->
                    <rect x="800" y="200" width="10" height="300" fill="#222"/>
                </g>
            </g>

            <!-- Train Body (Interior) -->
            <path d="M0 0 H1600 V900 H0 Z M150 150 Q150 120 180 120 H670 Q700 120 700 150 V600 Q700 630 670 630 H180 Q150 630 150 600 Z" fill="#4a1010" fill-rule="evenodd"/>
            
            <!-- Window Frame Shadow -->
            <rect x="150" y="150" width="550" height="450" rx="40" fill="none" stroke="#000" stroke-width="20" opacity="0.5"/>

            <!-- Worn Blue Seats -->
            <path d="M0 700 Q400 670 800 700 L800 900 H0 Z" fill="#152b47"/>
            <path d="M0 740 Q400 720 750 740" fill="none" stroke="#0a1a2e" stroke-width="10"/>

            <!-- Rain Drops -->
            <g class="rain-drops">
                <circle class="rain-drop" cx="200" cy="200" r="2" />
                <circle class="rain-drop" cx="400" cy="300" r="1.5" />
                <circle class="rain-drop" cx="600" cy="250" r="2.5" />
            </g>

            <!-- Ceiling Fan Silhouette -->
            <circle cx="400" cy="50" r="35" fill="#000" opacity="0.8"/>
            <rect x="300" y="45" width="200" height="10" rx="5" fill="#000" opacity="0.8"/>
        </svg>
    </div>

    <div class="vignette"></div>
    <div class="film-grain"></div>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="ist-clock" id="clock">00:00 PM</div>
            <div class="status-pill"><span class="live-dot">●</span> <span id="online-count">1107</span> यात्री ऑनलाइन</div>
            <div class="source-selector">
                <button class="chip active" id="btn-yt" onclick="switchMode('youtube')">YouTube</button>
                <button class="chip" id="btn-sp" onclick="switchMode('spotify')">Spotify</button>
                <button class="chip" style="background: rgba(212,160,23,0.2)" onclick="openModal()">+ Custom URL</button>
            </div>
        </div>

        <div class="hero">
            <h1 class="main-title">मुंबई लोकल</h1>
            <p class="tagline">वो सफ़र... जो मंज़िल से ज़्यादा याद रहा।</p>
        </div>

        <div class="player-anchor">
            <!-- Playlist Fast-Switcher -->
            <div class="source-selector">
                <button class="chip" onclick="loadInternal('yt1')">Classic Bollywood</button>
                <button class="chip" onclick="loadInternal('sp1')">Mumbai Lofi</button>
                <button class="chip" onclick="loadInternal('sp2')">Old Memories</button>
            </div>

            <!-- YouTube Custom Player UI -->
            <div class="yt-player-card" id="yt-ui">
                <div class="progress-bar-container"><div class="progress-fill" id="p-fill"></div></div>
                <div class="album-art" id="art-disc">
                    <img id="track-thumb" src="https://via.placeholder.com/100/111/d4a017?text=.." alt="">
                </div>
                <div class="meta">
                    <div class="song-name" id="song-title">शुरू करने के लिए प्ले दबाएं</div>
                    <div class="artist" id="song-artist">मुंबई लोकल रेडियो</div>
                </div>
                <div class="btn-wrap">
                    <button class="control-btn" onclick="ytPrev()">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="control-btn play-trigger" onclick="toggleYT()">
                        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="control-btn" onclick="ytNext()">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Spotify Embed -->
            <div id="spotify-embed-container"></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-bg" id="modal-container">
        <div class="modal">
            <h2>अपना गाना जोड़ें</h2>
            <input type="text" id="url-input" placeholder="YouTube या Spotify लिंक यहाँ पेस्ट करें...">
            <div class="modal-btns">
                <button class="action-btn btn-load" onclick="handleCustomLoad()">लोड करें</button>
                <button class="action-btn btn-cancel" onclick="closeModal()">रद्द करें</button>
            </div>
        </div>
    </div>

    <div id="yt-api-node"></div>

    <script>
        // --- 1. CLOCK & ONLINE STATS ---
        function updateClock() {
            const now = new Date().toLocaleTimeString('en-US', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById('clock').innerText = now;
        }
        setInterval(updateClock, 1000); updateClock();

        let count = 1107;
        setInterval(() => {
            count += Math.floor(Math.random() * 3) - 1;
            document.getElementById('online-count').innerText = count.toLocaleString();
        }, 4000);

        // --- 2. PLAYER LOGIC ---
        let player;
        let mode = 'youtube';
        const sp1 = "0z2CTWUImj0RmFzDlODvWI"; // Provided Spotify 1
        const sp2 = "5o4yd47NJKicNYHyij5DnO"; // Provided Spotify 2
        const yt1 = "PLDIoUOhQQPlWm_njQtKkNIk5RYSGgzomm"; // Default YT

        // Initialize YT API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-api-node', {
                height: '0', width: '0',
                playerVars: { listType: 'playlist', list: yt1 },
                events: {
                    'onStateChange': onYTStateChange,
                    'onReady': () => setInterval(updateYTProgress, 1000)
                }
            });
        }

        function onYTStateChange(e) {
            const data = player.getVideoData();
            const disc = document.getElementById('art-disc');
            const playBtn = document.getElementById('play-icon');

            if (e.data === 1) { // Playing
                disc.classList.add('playing');
                playBtn.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                document.getElementById('song-title').innerText = data.title;
                document.getElementById('song-artist').innerText = data.author;
                document.getElementById('track-thumb').src = `https://img.youtube.com/vi/${data.video_id}/default.jpg`;
            } else {
                disc.classList.remove('playing');
                playBtn.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        function updateYTProgress() {
            if (player && player.getCurrentTime) {
                const perc = (player.getCurrentTime() / player.getDuration()) * 100;
                document.getElementById('p-fill').style.width = perc + "%";
            }
        }

        function toggleYT() {
            if (player.getPlayerState() === 1) player.pauseVideo();
            else player.playVideo();
        }
        function ytNext() { player.nextVideo(); }
        function ytPrev() { player.previousVideo(); }

        // Mode Switching
        function switchMode(newMode) {
            mode = newMode;
            const ytUi = document.getElementById('yt-ui');
            const spUi = document.getElementById('spotify-embed-container');
            
            document.getElementById('btn-yt').classList.toggle('active', mode === 'youtube');
            document.getElementById('btn-sp').classList.toggle('active', mode === 'spotify');

            if (mode === 'youtube') {
                ytUi.style.display = 'flex';
                spUi.style.display = 'none';
            } else {
                ytUi.style.display = 'none';
                spUi.style.display = 'block';
                player.pauseVideo();
                if (!spUi.innerHTML) loadSpotifyEmbed(sp1);
            }
        }

        function loadSpotifyEmbed(id) {
            const container = document.getElementById('spotify-embed-container');
            container.innerHTML = `<iframe src="https://open.spotify.com/embed/playlist/${id}" width="100%" height="80" frameBorder="0" allowtransparency="true" allow="encrypted-media"></iframe>`;
            switchMode('spotify');
        }

        function loadInternal(code) {
            if (code === 'yt1') {
                switchMode('youtube');
                player.loadPlaylist({list: yt1});
            } else if (code === 'sp1') {
                loadSpotifyEmbed(sp1);
            } else if (code === 'sp2') {
                loadSpotifyEmbed(sp2);
            }
        }

        // Custom URL Handling
        function openModal() { document.getElementById('modal-container').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-container').style.display = 'none'; }

        function handleCustomLoad() {
            const url = document.getElementById('url-input').value;
            if (url.includes('spotify.com')) {
                const id = url.split('playlist/')[1]?.split('?')[0];
                if (id) loadSpotifyEmbed(id);
            } else if (url.includes('youtube.com')) {
                const listId = url.split('list=')[1]?.split('&')[0];
                if (listId) {
                    switchMode('youtube');
                    player.loadPlaylist({list: listId});
                }
            }
            closeModal();
        }
    </script>
</body>
</html>
